<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trust 1 Services office television. Heating, cooling, and plumbing in Quincy and Hanover, Massachusetts. Live local weather.">
  <meta name="theme-color" content="#000000">
  <meta name="board-version" content="20261030a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Trust 1 Services Office TV</title>
  <link rel="icon" href="assets/trust1-logo.png?v=20261030a">
  <link rel="stylesheet" href="assets/board.css?v=20261030a">
</head>
<body>
  <h1 class="sr">Trust 1 Services Office TV</h1>
  <div id="viewport">
    <div id="stage" data-sky="">
      <div class="sky" aria-hidden="true">
        <div class="sky-base"></div>
        <div class="sky-layer" data-layer="clear-day"></div>
        <div class="sky-layer" data-layer="clear-night"></div>
        <div class="sky-layer" data-layer="partly-day"></div>
        <div class="sky-layer" data-layer="partly-night"></div>
        <div class="sky-layer" data-layer="cloudy-day"></div>
        <div class="sky-layer" data-layer="cloudy-night"></div>
        <div class="sky-layer" data-layer="fog-day"></div>
        <div class="sky-layer" data-layer="fog-night"></div>
        <div class="sky-layer" data-layer="rain-day"></div>
        <div class="sky-layer" data-layer="rain-night"></div>
        <div class="sky-layer" data-layer="snow-day"></div>
        <div class="sky-layer" data-layer="snow-night"></div>
        <div class="sky-layer" data-layer="storm-day"></div>
        <div class="sky-layer" data-layer="storm-night"></div>
        <div class="stars">
          <i id="stars-a" class="field stars-a"></i>
          <i id="stars-b" class="field stars-b"></i>
        </div>
        <div class="sun">
          <div class="sun-glow"></div>
          <svg class="sun-rays" viewBox="0 0 200 200">
            <g fill="none" stroke="#ffe9bf" stroke-linecap="round">
              <path stroke-width="3" d="M100 8v26M100 166v26M8 100h26M166 100h26"></path>
              <path stroke-width="2.4" d="M30 30l18 18M152 152l18 18M170 30l-18 18M48 152l-18 18"></path>
              <path stroke-width="2" opacity="0.75" d="M18 62l22 8M160 130l22 8M18 138l22-8M160 70l22-8"></path>
            </g>
          </svg>
          <div class="sun-core"></div>
        </div>
        <div class="moon"><div class="moon-core"></div></div>
        <svg class="cloud cloud-a" viewBox="0 0 220 120"><ellipse cx="78" cy="74" rx="46" ry="28" fill="currentColor"></ellipse><ellipse cx="118" cy="58" rx="50" ry="36" fill="currentColor"></ellipse><ellipse cx="162" cy="74" rx="40" ry="26" fill="currentColor"></ellipse><ellipse cx="116" cy="82" rx="78" ry="24" fill="currentColor"></ellipse></svg>
        <svg class="cloud cloud-b" viewBox="0 0 220 120"><ellipse cx="78" cy="74" rx="46" ry="28" fill="currentColor"></ellipse><ellipse cx="118" cy="58" rx="50" ry="36" fill="currentColor"></ellipse><ellipse cx="162" cy="74" rx="40" ry="26" fill="currentColor"></ellipse><ellipse cx="116" cy="82" rx="78" ry="24" fill="currentColor"></ellipse></svg>
        <svg class="cloud cloud-c" viewBox="0 0 220 120"><ellipse cx="78" cy="74" rx="46" ry="28" fill="currentColor"></ellipse><ellipse cx="118" cy="58" rx="50" ry="36" fill="currentColor"></ellipse><ellipse cx="162" cy="74" rx="40" ry="26" fill="currentColor"></ellipse><ellipse cx="116" cy="82" rx="78" ry="24" fill="currentColor"></ellipse></svg>
        <svg class="cloud cloud-d" viewBox="0 0 220 120"><ellipse cx="78" cy="74" rx="46" ry="28" fill="currentColor"></ellipse><ellipse cx="118" cy="58" rx="50" ry="36" fill="currentColor"></ellipse><ellipse cx="162" cy="74" rx="40" ry="26" fill="currentColor"></ellipse><ellipse cx="116" cy="82" rx="78" ry="24" fill="currentColor"></ellipse></svg>
        <div class="mist"><span></span><span></span><span></span></div>
        <div class="rain-sheet"></div>
        <canvas id="precip"></canvas>
        <div class="snows">
          <i id="snow-a" class="field snow-a"></i>
          <i id="snow-b" class="field snow-b"></i>
          <i id="snow-c" class="field snow-c"></i>
        </div>
        <div class="bolt"></div>
        <div class="vignette"></div>
      </div>
      <div class="safe">
        <header class="top">
          <div class="brand">
            <img id="logo" class="logo" src="assets/trust1-logo.svg?v=20261030a" alt="Trust 1 Services">
            <p class="brand-name">Trust 1 Services</p>
            <p class="where">Quincy and Hanover, Massachusetts</p>
          </div>
          <div class="clock">
            <div class="clock-time" id="clock-time">–:–</div>
            <div class="clock-date" id="clock-date"></div>
          </div>
        </header>
        <section class="hero" id="hero">
          <div class="town-row">
            <div class="town is-on" id="town-quincy" data-town="quincy">
              <span class="pip"></span>
              <span class="name">Quincy</span>
              <span class="mini" id="mini-quincy"></span>
            </div>
            <div class="town" id="town-hanover" data-town="hanover">
              <span class="pip"></span>
              <span class="name">Hanover</span>
              <span class="mini" id="mini-hanover"></span>
            </div>
          </div>
          <div class="temp"><span id="wx-temp">–</span><span class="deg" id="wx-deg" hidden>°</span></div>
          <div class="condition">
            <div class="ico ico-lg" id="wx-ico"></div>
            <div id="wx-cond">–</div>
          </div>
          <div class="stats">
            <div class="stat"><span class="k">Feels like</span><span class="v" id="wx-feels">–</span></div>
            <div class="stat"><span class="k">Wind</span><span class="v" id="wx-wind">–</span></div>
            <div class="stat"><span class="k">Humidity</span><span class="v" id="wx-hum">–</span></div>
            <div class="stat"><span class="k">High / Low</span><span class="v" id="wx-hilo">–</span></div>
          </div>
        </section>
        <div class="strips" id="strips">
          <div class="strip">
            <div class="strip-label" id="hourly-label">Next 12 hours</div>
            <div class="hourly" id="hourly"></div>
          </div>
          <div class="strip daily-strip">
            <div class="strip-label">Five days</div>
            <div class="daily" id="daily"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/board.js?v=20261030a"></script>
</body>
</html>
